name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + build + size + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      # Vitest browser provider launches the Chromium that ships with playwright.
      # ubuntu-latest doesn't cache the browser binary across runs, and pnpm's
      # frozen install skips playwright's postinstall, so download it explicitly.
      - name: install playwright chromium
        run: pnpm --filter @labcat/crt exec playwright install chromium --with-deps

      - name: test
        run: pnpm --filter @labcat/crt test

      - name: size budget
        run: pnpm --filter @labcat/crt size
