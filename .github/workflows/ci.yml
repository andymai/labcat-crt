name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + build + size + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      # Vitest browser provider launches the Chromium that ships with playwright.
      # ubuntu-latest doesn't cache the browser binary across runs, and pnpm's
      # frozen install skips playwright's postinstall, so download it explicitly.
      - name: install playwright chromium
        run: pnpm --filter @labcat/crt exec playwright install chromium --with-deps

      - name: test
        run: pnpm --filter @labcat/crt test

      - name: size budget
        run: pnpm --filter @labcat/crt size
