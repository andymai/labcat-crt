name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + build + size + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      # Vitest browser provider launches the Chromium that ships with playwright.
      # ubuntu-latest doesn't cache the browser binary across runs, and pnpm's
      # frozen install skips playwright's postinstall, so download it explicitly.
      - name: install playwright chromium
        run: pnpm --filter @labcat/crt exec playwright install chromium --with-deps

      - name: test
        run: pnpm --filter @labcat/crt test

      - name: size budget
        run: pnpm --filter @labcat/crt size
