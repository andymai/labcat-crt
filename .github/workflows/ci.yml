name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + build + size + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      # Vitest browser provider launches the Chromium that ships with playwright.
      # ubuntu-latest doesn't cache the browser binary across runs, and pnpm's
      # frozen install skips playwright's postinstall, so download it explicitly.
      - name: install playwright chromium
        run: pnpm --filter @labcat/crt exec playwright install chromium --with-deps

      - name: test
        run: pnpm --filter @labcat/crt test

      - name: size budget
        run: pnpm --filter @labcat/crt size
