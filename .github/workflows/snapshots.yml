name: Snapshots

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'apps/demo/src/**'
      - 'apps/demo/tests/**'
      - 'apps/demo/playwright.config.ts'
      - '.github/workflows/snapshots.yml'

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: playwright snapshot regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-jammy

    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        run: npm install -g pnpm@10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build core
        run: pnpm --filter @labcat/crt build

      - name: build demo
        run: pnpm --filter @labcat/crt-demo build

      - name: run snapshot tests
        id: snapshots
        run: pnpm test:visual

      - name: upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/demo/playwright-report/
          retention-days: 14
